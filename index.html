<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Пары 2576-ЭБ</title>
<meta name="theme-color" content="#EDEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050608" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Пары">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
html,body{margin:0;height:100%;background:#000;touch-action:manipulation}
body{display:grid;place-items:center;overflow:hidden}
img{width:100vw;height:100vh;height:100dvh;object-fit:contain;display:block}
</style>
</head>
<body>
<img src="pic.png" alt="">
<audio id="m" src="music.mp3?v=2" loop preload="auto" playsinline></audio>
<script>
(function(){
  var a=document.getElementById("m");
  a.volume=1;
  function go(){a.volume=1;var p=a.play();if(p&&p.catch)p.catch(function(){});}
  go();
  // Браузеры не дают включить звук без касания: тогда стартуем от первого тапа
  ["pointerdown","touchstart","keydown","click"].forEach(function(t){
    document.addEventListener(t,function(){if(a.paused)go();},{passive:true});
  });
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&a.paused)go();});
})();
</script>
<script>
["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();},{passive:false});});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
</body>
</html>
